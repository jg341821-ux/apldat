name: Update data.json (ESPN + Local Badges)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-data-json
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run updater
        env:
          DATA_PATH: data.json
          BADGES_MAP_PATH: badges_map.json
          MISSING_BADGE: assets/escudos/_missing.png
        run: node scripts/update-data.mjs

      - name: Commit & push if changed
        env:
          DATA_PATH: data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DATA_PATH}" badges_map.json
          git diff --staged --quiet || git commit -m "chore: auto update data.json"
          git push
